# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 300
  base: 700
  high: 1000
  source: "https://www.facebook.com/share/p/19euXvkYzd/ - Fanpage Đào tạo Nhân tài AI thực chiến; thấp, cao: (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: chua_hieu_kien_thuc
    share: 0.30              # tỉ lệ người dùng kiểu này
    uses_per_month: 20       # số phiên / người / tháng
    turns_per_session: 8    # số lượt hỏi trong một phiên
    source: "Khảo sát qua Google Form. Số phiên và lượt hỏi tự ước lượng từ dữ liệu."
  - name: khong_chac_yeu_cau_de
    share: 0.35
    uses_per_month: 16
    turns_per_session: 6
    source: "Khảo sát qua Google Form (gộp 'không chắc đề yêu cầu làm gì', 'không chắc kết quả đạt yêu cầu`, và 'sót yêu cầu sau mới biết'. Số phiên và lượt hỏi tự ước lượng từ dữ liệu."
  - name: loi_ky_thuat
    share: 0.35
    uses_per_month: 12
    turns_per_session: 4
    source: "Khảo sát qua Google Form (gộp 'lỗi cài đặt cấu hình máy' và 'lỗi docker, deploy'). Số phiên và lượt hỏi tự ước lượng từ dữ liệu."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.8-flash-lite
    input: 0.75
    output: 3.75
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 28/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 28/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
